<header class="mb-5">
  <nav class="navbar navbar-expand-lg bg-body-tertiary ps-3 pe-4">
    <a class="navbar-brand" href="#">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Переключатель навигации">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" [routerLink]="''">Главная</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="'/catalog'">Каталог</a>
        </li>
      </ul>
      <div class="d-flex" role="search" >
        <input [(ngModel)]="inputValue" class="form-control me-2" type="search" placeholder="Поиск чая">
        <button [routerLink]="'/catalog'" [queryParams]="{search: inputValue}" (click)="onSearch()" class="btn btn-outline-primary ps-4 pe-4 hvr-glow me-2"  type="submit">Найти</button>
        <button *ngIf="inputValue" (click)="clearInput()" class="btn btn-outline-secondary ps-4 pe-4 hvr-glow" type="submit">Очистить</button>
      </div>
    </div>
  </nav>
</header>

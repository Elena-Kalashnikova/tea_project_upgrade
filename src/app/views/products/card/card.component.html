<div class="card wow animate__backInLeft d-flex justify-content-center align-items-center border-0" id="card">
  <img src="{{card.image}}" class="card-img-top w-25" alt="detox tea">
  <div class="card-body d-flex flex-column justify-content-center align-items-center">
    <h5 class="card-title fw-bold text-center">{{card.title}}</h5>
    <p class="card-text text-center">Цена: {{card.price}} руб.</p>
    <p class="card-text ps-5 pe-5 pt-3 pb-3 text-center">{{card.description}}</p>
    <a [routerLink]="'/order'" [queryParams]="{product: card.title}"  class="btn btn-primary hvr-grow-shadow w-25 mb-4">Купить</a>
  </div>
</div>
